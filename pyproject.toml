[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reasoning-optimization"
version = "0.1.0"
description = "Reproducible Qwen3-0.6B reasoning optimization experiments"
requires-python = ">=3.10"
dependencies = [
  "datasets>=3.0,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
training = [
  "transformers==4.57.1",
  "peft==0.17.1",
  "accelerate==1.10.1",
  "tensorboard>=2.18,<3",
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]
